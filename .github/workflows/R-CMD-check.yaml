# Adapted from https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: devel}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
          needs: check
      - name: Install LaTeX for the Sweave vignette
        shell: Rscript {0}
        run: |
          tinytex::install_tinytex()
          tinytex::tlmgr_install(c("geometry", "hyperref", "amsmath", "fancyvrb"))
          bins <- list.dirs(file.path(tinytex::tinytex_root(), "bin"),
                            full.names = TRUE, recursive = FALSE)
          cat(paste(bins, collapse = "\n"), "\n",
              file = Sys.getenv("GITHUB_PATH"), append = TRUE, sep = "")
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
